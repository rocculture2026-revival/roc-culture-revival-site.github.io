# 改了文章或產生器（content.py、reels_content.py 等）推上 main 後，自動重新產生網站、IG 圖與 Reels，並把結果提交回來。
name: build
on:
  push:
    branches: [main]
    paths: [content.py, reels_content.py, build.py, reels.py, render_ig.js, music.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true  # 連續推送時只保留最新一次，避免舊的產出和新的衝突
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安裝 Playwright、ffmpeg 與中文字型
        run: |
          npm install --no-save playwright@1.47.2
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: 產生網站、貼文稿、IG 圖
        run: python3 build.py
      - name: 產生 Reels
        env:
          GCP_TTS_KEY: ${{ secrets.GCP_TTS_KEY }}
        run: python3 reels.py
      - name: 提交結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs posts assets/tts
          git diff --cached --quiet && exit 0
          git commit -m "自動重新產生網站與素材"
          if git pull --rebase; then
            git push
          else
            git rebase --abort
            echo "有更新的提交已推上，交給下一次 build 重新產生"
          fi
