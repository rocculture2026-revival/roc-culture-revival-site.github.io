# 每 30 分鐘檢查 queue.json，把到時間、approved 為 true 的貼文發到各平台，結果記在 posted.json。
name: publish
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "試跑（只檢查，不真的發）"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 發文
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          IG_TOKEN_MAIN: ${{ secrets.IG_TOKEN_MAIN }}
          THREADS_TOKEN_MAIN: ${{ secrets.THREADS_TOKEN_MAIN }}
          IG_TOKEN_PROMO: ${{ secrets.IG_TOKEN_PROMO }}
          THREADS_TOKEN_PROMO: ${{ secrets.THREADS_TOKEN_PROMO }}
          FB_PAGE_TOKEN_MAIN: ${{ secrets.FB_PAGE_TOKEN_MAIN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_MAIN: ${{ secrets.YT_REFRESH_TOKEN_MAIN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN_MAIN: ${{ secrets.X_ACCESS_TOKEN_MAIN }}
          X_ACCESS_SECRET_MAIN: ${{ secrets.X_ACCESS_SECRET_MAIN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_MAIN: ${{ secrets.TIKTOK_REFRESH_TOKEN_MAIN }}
        run: python3 publish.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: 記錄已發布
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "記錄已發布貼文" && git pull --rebase && git push)
